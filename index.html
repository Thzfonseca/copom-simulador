<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COPOM - Simulador IPCA+</title>

  <!-- FONTES E ESTILO -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>

  <!-- CHART.JS E ANOTAÇÃO -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>

  <!-- EXPORTAÇÃO WORD -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.min.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-title">COPOM</div>
  </header>

  <main class="container">

    <!-- TÍTULO -->
    <section class="page-title">
      <h1>Simulador Estratégico de IPCA+</h1>
      <p class="subtext">Ferramenta de apoio à decisão para Advisors e investidores de alta renda.</p>
    </section>

    <!-- PREMISSAS E PAPÉIS -->
    <section id="premissas-section" class="card">
      <h2>Premissas Econômicas</h2>
      <div id="tabela-premissas"></div>

      <h3 style="margin-top: 24px;">Configuração dos Papéis</h3>
      <div style="display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 16px;">
        <div>
          <h4>Papel Curto</h4>
          <label>Taxa (% a.a.): <input type="number" id="taxa-curta" value="5.0" step="0.01"/></label><br/>
          <label>Prazo (anos): <input type="number" id="prazo-curta" value="3" step="0.5"/></label>
        </div>
        <div>
          <h4>Papel Longo</h4>
          <label>Taxa (% a.a.): <input type="number" id="taxa-longa" value="5.5" step="0.01"/></label><br/>
          <label>Prazo (anos): <input type="number" id="prazo-longa" value="5" step="0.5"/></label>
        </div>
      </div>
    </section>

    <!-- BOTÃO -->
    <section class="card">
      <button id="btn-simular">Rodar Simulação</button>
    </section>

    <!-- CENÁRIO -->
    <section id="cenario-section" class="card">
      <h2>Cenário Macroeconômico</h2>
      <div id="form-markov"></div>
    </section>

    <!-- RESUMO -->
    <section id="resumo-section" class="card">
      <h2>Resumo Estratégico</h2>
      <div id="resumo-cards"></div>
    </section>

    <!-- GRÁFICOS -->
    <section id="graficos-section" class="card">
      <h2>Gráficos de Rentabilidade</h2>
      <canvas id="grafico-acumulado" style="max-width: 100%; height: 400px;"></canvas>
      <canvas id="grafico-anualizado" style="max-width: 100%; height: 400px;"></canvas>
    </section>

    <!-- NARRATIVA -->
    <section id="narrativa-section" class="card">
      <h2>Análise e Interpretação</h2>
      <div id="output-narrativo"></div>
    </section>

    <!-- EXPORTAÇÃO -->
    <section id="exportacao-section" class="card export-panel">
      <button id="btn-exportar">Exportar Análise (Word)</button>
    </section>

    <!-- LOG DE DEBUG -->
    <section id="debug-section" class="debug-log">
      <button onclick="toggleDebug()">Ver Log Técnico</button>
      <div id="relatorio-erros" style="display:none;"></div>
    </section>

  </main>

  <!-- SCRIPTS -->
  <script>
    function registrarErro(msg) {
      console.error("[COPOM-ERRO]", msg);
      window.__errosDebug = window.__errosDebug || [];
      window.__errosDebug.push(msg);
      const div = document.getElementById("relatorio-erros");
      if (div) {
        div.style.display = "block";
        div.innerHTML += `<div>[!] ${msg}</div>`;
        div.scrollTop = div.scrollHeight;
      }
    }

    function logar(msg) {
      console.log("[COPOM-LOG]", msg);
    }
  </script>
  <script src="script.js"></script>
  <script src="simulador.js"></script>
  <script src="grafico.js"></script>
</body>
</html>
